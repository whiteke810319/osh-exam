<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>職安衛全能刷題與重點複習系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .lecture-hl { color: #1e40af; font-weight: 700; }
    .lecture-tag { background: #fef3c7; color: #92400e; padding: 1px 4px; border-radius: 4px; font-weight: 600; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

  <!-- 頂部導航 -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-graduation-cap text-amber-400 text-xl"></i>
        <h1 class="font-bold text-base tracking-wide">職安衛全能刷題庫</h1>
      </div>
      <div class="flex items-center space-x-2 text-xs">
        <button onclick="switchTab('import')" class="px-2.5 py-1 bg-indigo-700/80 rounded-lg hover:bg-indigo-700 transition">
          <i class="fa-solid fa-database mr-1"></i>題庫庫存
        </button>
      </div>
    </div>

    <!-- 6大功能頁籤 -->
    <div class="max-w-md mx-auto grid grid-cols-6 bg-indigo-700 text-[10px] text-center border-t border-indigo-500/30">
      <button onclick="switchTab('lecture')" id="tab-lecture" class="py-2.5 font-bold text-white border-b-2 border-amber-400">
        <i class="fa-solid fa-book-bookmark block text-sm mb-0.5 text-amber-300"></i>複習講義
      </button>
      <button onclick="switchTab('config')" id="tab-config" class="py-2.5 text-indigo-200 hover:text-white">
        <i class="fa-solid fa-sliders block text-sm mb-0.5"></i>自選模考
      </button>
      <button onclick="switchTab('practice')" id="tab-practice" class="py-2.5 text-indigo-200 hover:text-white">
        <i class="fa-solid fa-book-open-reader block text-sm mb-0.5"></i>順序練習
      </button>
      <button onclick="switchTab('wrong')" id="tab-wrong" class="py-2.5 text-indigo-200 hover:text-white relative">
        <i class="fa-solid fa-triangle-exclamation block text-sm mb-0.5"></i>錯題本
        <span id="wrong-badge" class="hidden absolute top-1 right-1 px-1 py-0.2 bg-rose-500 text-white rounded-full text-[8px]">0</span>
      </button>
      <button onclick="switchTab('chart')" id="tab-chart" class="py-2.5 text-indigo-200 hover:text-white">
        <i class="fa-solid fa-chart-line block text-sm mb-0.5"></i>成績曲線
      </button>
      <button onclick="switchTab('search')" id="tab-search" class="py-2.5 text-indigo-200 hover:text-white">
        <i class="fa-solid fa-magnifying-glass block text-sm mb-0.5"></i>搜尋
      </button>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4 pb-20">

    <!-- 1. 重點複習講義分頁 -->
    <div id="view-lecture" class="space-y-3">
      <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between gap-2">
        <div class="flex items-center text-xs font-bold text-slate-700 shrink-0">
          <i class="fa-solid fa-filter mr-1.5 text-indigo-500"></i>題庫講義
        </div>
        <select id="lecture-pool-select" onchange="renderLectures()" class="w-full py-1.5 px-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-indigo-700 focus:outline-none">
          <option value="ALL">📚 全部精選彙整講義</option>
          <option value="營造業主管考題">營造業主管考題 (專屬實務)</option>
          <option value="甲種業務主管 (800題庫)">甲種業務主管 (800題庫)</option>
          <option value="甲級職業安全管理 (22000)">甲級職業安全管理 (22000)</option>
          <option value="甲級職業衛生管理 (22100)">甲級職業衛生管理 (22100)</option>
          <option value="職安共同科目 (90006)">職安共同科目 (90006)</option>
          <option value="工作倫理與道德 (90007)">工作倫理與道德 (90007)</option>
        </select>
      </div>
      <div id="lecture-cards-container" class="space-y-3"></div>
    </div>

    <!-- 2. 測驗設定頁面 -->
    <div id="view-config" class="hidden space-y-4">
      <div class="bg-gradient-to-r from-indigo-600 to-indigo-700 p-4 rounded-2xl text-white shadow-md flex items-center justify-between">
        <div>
          <p class="text-xs text-indigo-200 font-medium">系統已載入題庫總數</p>
          <p class="text-2xl font-black mt-0.5" id="stat-total-q">0 題</p>
        </div>
        <button onclick="quickSelectAllPools()" class="px-3 py-1.5 bg-amber-400 hover:bg-amber-300 text-indigo-950 font-bold text-xs rounded-xl shadow-sm transition flex items-center">
          <i class="fa-solid fa-bolt mr-1"></i>一鍵全題庫總複習
        </button>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2.5">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800 flex items-center">
            <i class="fa-solid fa-layer-group mr-2 text-indigo-500"></i>1. 選擇題庫大類
          </h2>
          <span class="text-[11px] text-slate-400">可多選或全選</span>
        </div>
        <div id="pool-selector" class="space-y-1.5 text-xs"></div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2.5">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800 flex items-center">
            <i class="fa-solid fa-tags mr-2 text-indigo-500"></i>2. 細部章節範圍
          </h2>
          <div class="text-xs space-x-2">
            <button onclick="toggleAllSubCategories(true)" class="text-indigo-600 font-medium">全選</button>
            <span class="text-slate-300">|</span>
            <button onclick="toggleAllSubCategories(false)" class="text-slate-400 font-medium">清空</button>
          </div>
        </div>
        <div id="category-selector" class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-1 custom-scrollbar text-xs"></div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <h2 class="text-sm font-bold text-slate-800 flex items-center">
          <i class="fa-solid fa-list-ol mr-2 text-indigo-500"></i>3. 選擇抽題數量
        </h2>
        <div class="grid grid-cols-4 gap-2">
          <button type="button" onclick="selectCount(10)" class="btn-count py-2.5 rounded-xl border text-center font-bold text-xs bg-indigo-50 border-indigo-600 text-indigo-700 transition">10 題</button>
          <button type="button" onclick="selectCount(20)" class="btn-count py-2.5 rounded-xl border text-center font-bold text-xs bg-white border-slate-200 text-slate-600 transition">20 題</button>
          <button type="button" onclick="selectCount(50)" class="btn-count py-2.5 rounded-xl border text-center font-bold text-xs bg-white border-slate-200 text-slate-600 transition">50 題</button>
          <button type="button" onclick="selectCount(100)" class="btn-count py-2.5 rounded-xl border text-center font-bold text-xs bg-white border-slate-200 text-slate-600 transition">100 題</button>
        </div>
      </div>

      <div class="space-y-2 pt-1">
        <button onclick="startExam(false)" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition flex items-center justify-center text-sm">
          <i class="fa-solid fa-stopwatch mr-2"></i>開始模擬考（計時評分）
        </button>
        <button onclick="startExam(true)" class="w-full py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl font-bold active:scale-[0.98] transition flex items-center justify-center text-xs">
          <i class="fa-solid fa-bolt mr-2 text-amber-500"></i>即時回饋練習（每題看解答）
        </button>
      </div>
    </div>

    <!-- 3. 答題中畫面 -->
    <div id="view-exam" class="hidden space-y-4">
      <div class="bg-white px-4 py-3 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span id="exam-mode-badge" class="px-2 py-0.5 rounded text-[11px] font-bold bg-indigo-100 text-indigo-700">模擬考</span>
          <span class="text-xs font-bold text-slate-500" id="exam-progress">1 / 20</span>
        </div>
        <div id="timer-box" class="flex items-center space-x-1.5 text-rose-600 font-mono font-bold text-sm">
          <i class="fa-regular fa-clock"></i>
          <span id="exam-timer">20:00</span>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4 relative">
        <div class="flex items-start justify-between gap-2">
          <div class="flex flex-wrap gap-1 items-center">
            <span id="q-type-badge" class="text-[10px] px-2 py-0.5 bg-indigo-50 text-indigo-600 font-bold rounded">單選題</span>
            <span id="q-category" class="text-xs px-2 py-0.5 bg-slate-100 text-slate-600 font-medium rounded truncate max-w-[200px]">章節名稱</span>
          </div>
          <button onclick="toggleBookmark()" id="btn-bookmark" class="text-slate-400 hover:text-amber-500 transition text-base shrink-0">
            <i class="fa-regular fa-bookmark"></i>
          </button>
        </div>
        
        <h3 id="q-text" class="text-sm sm:text-base font-bold text-slate-800 leading-relaxed min-h-[50px]">載入中...</h3>
        <div id="q-options" class="space-y-2.5 pt-1"></div>

        <div id="multi-submit-container" class="hidden pt-2">
          <button onclick="submitMultiAnswer()" id="btn-multi-submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs transition">確認送出此題答案</button>
        </div>

        <div id="q-explanation" class="hidden mt-4 p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-1.5">
          <p class="font-bold text-slate-700" id="exp-status"></p>
          <div id="exp-sarcasm" class="hidden p-2 rounded-lg bg-amber-50 border border-amber-200 text-amber-900 font-bold text-[11px] leading-relaxed"></div>
          <div id="exp-streak-status" class="p-1.5 rounded-lg bg-indigo-50 text-indigo-800 font-bold text-[11px]"></div>
          <p class="text-slate-500 text-[11px] leading-normal" id="exp-note"></p>
        </div>
      </div>

      <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200">
        <p class="text-[11px] text-slate-400 font-medium mb-2">題號快速切換</p>
        <div id="exam-palette" class="flex gap-1.5 overflow-x-auto pb-1 custom-scrollbar"></div>
      </div>

      <div class="flex gap-2">
        <button onclick="prevQuestion()" id="btn-prev" class="flex-1 py-3 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold text-xs disabled:opacity-40">上一題</button>
        <button onclick="nextQuestion()" id="btn-next" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold text-xs">下一題</button>
        <button onclick="finishExam()" class="px-4 py-3 bg-emerald-600 text-white rounded-xl font-bold text-xs">交卷</button>
      </div>
    </div>

    <!-- 4. 成績結算頁面 -->
    <div id="view-result" class="hidden space-y-4">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center space-y-3">
        <div id="result-icon" class="w-16 h-16 rounded-full mx-auto flex items-center justify-center text-2xl bg-emerald-100 text-emerald-600">
          <i class="fa-solid fa-trophy"></i>
        </div>
        <h2 class="text-lg font-black text-slate-800" id="result-title">測驗完成！</h2>
        
        <div class="py-1">
          <span class="text-4xl font-black text-indigo-600" id="result-score">85</span>
          <span class="text-slate-400 text-xs">/ 100分</span>
        </div>

        <div class="p-3 bg-indigo-50/80 rounded-xl border border-indigo-100 text-xs text-indigo-900 font-medium leading-relaxed" id="result-comment">
          評語分析中...
        </div>

        <div class="grid grid-cols-3 gap-2 pt-2 border-t text-xs">
          <div class="p-2 bg-slate-50 rounded-lg">
            <p class="text-slate-400 text-[10px]">總題數</p>
            <p class="font-bold text-slate-700 mt-0.5" id="res-total">20</p>
          </div>
          <div class="p-2 bg-emerald-50 rounded-lg">
            <p class="text-emerald-600 text-[10px]">答對</p>
            <p class="font-bold text-emerald-700 mt-0.5" id="res-correct">17</p>
          </div>
          <div class="p-2 bg-rose-50 rounded-lg">
            <p class="text-rose-600 text-[10px]">答錯</p>
            <p class="font-bold text-rose-700 mt-0.5" id="res-wrong">3</p>
          </div>
        </div>
      </div>

      <div class="space-y-2">
        <button onclick="switchTab('chart')" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold text-xs flex items-center justify-center">
          <i class="fa-solid fa-chart-line mr-1.5"></i>查看成績曲線與毒舌講評
        </button>
        <button onclick="switchTab('config')" class="w-full py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl font-bold text-xs">
          再測驗一次
        </button>
      </div>
    </div>

    <!-- 5. 成績曲線頁面 -->
    <div id="view-chart" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800 flex items-center">
            <i class="fa-solid fa-chart-area mr-2 text-indigo-500"></i>成績成長趨勢
          </h2>
          <button onclick="clearHistoryRecords()" class="text-[11px] text-rose-500 hover:underline">清空歷史紀錄</button>
        </div>
        <select id="chart-filter-pool" onchange="renderScoreChart()" class="w-full py-2 px-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-indigo-700 focus:outline-none">
          <option value="ALL">🌟 全部題庫 (跨科總歷程)</option>
        </select>
      </div>

      <div class="p-4 bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200/80 rounded-2xl space-y-1.5">
        <div class="flex items-center text-xs font-black text-amber-900">
          <i class="fa-solid fa-comment-dots mr-1.5 text-amber-600"></i>考官毒舌/幽默總評
        </div>
        <p id="chart-trend-comment" class="text-xs text-amber-950 font-medium leading-relaxed">
          目前數據累積中，請多做幾回測驗！
        </p>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <div class="h-64 relative">
          <canvas id="scoreHistoryChart"></canvas>
        </div>
        <p class="text-[11px] text-center text-slate-400">💡 紅色虛線為 60 分及格標準線</p>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2.5">
        <h3 class="text-xs font-bold text-slate-700">最近測驗明細與即時評語</h3>
        <div id="history-list" class="space-y-2 max-h-56 overflow-y-auto pr-1 custom-scrollbar text-xs"></div>
      </div>
    </div>

    <!-- 6. 題庫庫存管理頁面 -->
    <div id="view-import" class="hidden space-y-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <h2 class="font-bold text-sm text-slate-800 flex items-center">
          <i class="fa-solid fa-cloud-arrow-up mr-2 text-indigo-600"></i>管理與匯入題庫 JSON
        </h2>
        <p class="text-xs text-slate-500 leading-relaxed">
          若有產生新的 <code>questions_all.json</code>，可手動選取載入。
        </p>
        <div class="pt-2">
          <label class="w-full block py-3 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-xl text-center text-xs font-bold cursor-pointer hover:bg-indigo-100 transition">
            <i class="fa-solid fa-file-arrow-up mr-1"></i>選取 questions_all.json 檔案
            <input type="file" id="file-input" accept=".json" class="hidden" onchange="handleFileImport(event)">
          </label>
        </div>
      </div>
    </div>

    <!-- 7. 搜尋頁面 -->
    <div id="view-search" class="hidden space-y-3">
      <div class="relative">
        <input type="text" id="search-input" oninput="handleSearch()" placeholder="輸入關鍵字檢索題目..." class="w-full py-3 pl-10 pr-4 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
      </div>
      <div id="search-results" class="space-y-2 max-h-[65vh] overflow-y-auto pr-1 custom-scrollbar"></div>
    </div>

  </main>

  <script>
    let allQuestions = [];
    let currentPool = [];
    let currentIndex = 0;
    let userAnswers = {};
    let multiDraft = [];
    let examTimer = null;
    let timeLeft = 0;
    let isInstantFeedback = false;
    let selectedCount = 10;
    let wrongBook = new Set();
    let wrongStreakMap = {};
    let correctStreakMap = {};
    let bookmarks = new Set();
    let examHistory = [];
    let currentExamPoolName = "全題庫總複習";
    let chartInstance = null;

    const presetLectures = [
      {
        pool: "營造業主管考題",
        title: "營造安全衛生設施標準與作業主管法定職責",
        points: [
          "露天垂直開挖深度達 <span class='lecture-hl'>1.5 公尺以上</span> 者，應設置擋土支撐，並指派露天開挖作業主管在場[cite: 5, 7]。",
          "高度在 <span class='lecture-hl'>5 公尺以上</span> 之施工架組配/拆除，應指派合格之施工架組配作業主管在場監督[cite: 5, 7]。",
          "高度 <span class='lecture-hl'>2 公尺以上</span> 開口防護：應設高度 <span class='lecture-hl'>90 公分以上</span> 之護欄（中欄杆 35~55cm、腳趾板 10cm）或安全網。",
          "施工架繫牆桿（壁連座）：垂直方向不超過 <span class='lecture-hl'>5.5 公尺</span>，水平方向不超過 <span class='lecture-hl'>7.5 公尺</span>[cite: 5, 6, 7]。",
          "合梯使用規範：梯腳與地面夾角應在 <span class='lecture-hl'>75 度以內</span>，兩梯腳間應有金屬繫材扣牢，嚴禁單側使用或坐在頂板作業[cite: 5, 6]。",
          "鋼構組配安全母索：應架設高 <span class='lecture-hl'>110 公分</span>、直徑 <span class='lecture-hl'>9 mm</span> 之鋼索作為安全母索，並佩掛背負式安全帶[cite: 5]。"
        ]
      },
      {
        pool: "營造業主管考題",
        title: "營造工地感電、倒塌與起重吊掛安全",
        points: [
          "漏電斷路器：營造工地臨時用電、潮濕場所電動工具，應裝設 <span class='lecture-hl'>高感度高速型 (30mA / 0.1秒)</span> 漏電斷路器[cite: 5, 6, 7]。",
          "電銲機防護：交流電銲機應加裝 <span class='lecture-hl'>自動電擊防止裝置</span>，二次側無載電壓降至 <span class='lecture-hl'>24~25 伏特以下</span>[cite: 5, 6, 7]。",
          "鋼索報廢標準：一撚間斷線達 <span class='lecture-hl'>10% 以上</span>、直徑磨損減少達公稱直徑 <span class='lecture-hl'>7% 以上</span> 或扭結者一律禁止使用[cite: 5, 6, 7]。",
          "長條物吊掛：吊運長度超過 <span class='lecture-hl'>6 公尺</span> 之鋼構或 <span class='lecture-hl'>5 公尺</span> 之鋼筋，應於兩端繫牽引繩捆紮，嚴禁徒手扶持或下方站人[cite: 5, 6, 7]。",
          "沉箱開挖限制：沉箱刃口至頂版淨距應在 <span class='lecture-hl'>1.8 公尺以上</span>，刃口下端不得下挖超過 <span class='lecture-hl'>50 公分</span>[cite: 5, 7]。"
        ]
      },
      {
        pool: "營造業主管考題",
        title: "一、 營造安全衛生設施標準（核心數字符號大全）",
        points: [

            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && data.length > 0) {
                allQuestions = data;
                saveStorage();
                break;
              }
            }
          } catch (e) {}
        }
      }

      renderLectures();
      renderPoolSelectors();
      renderSubCategories();
      updateStats();
      populateChartFilter();
    });

    function loadStorage() {
      const savedQ = localStorage.getItem('osh_q_db');
      if (savedQ) { try { allQuestions = JSON.parse(savedQ); } catch(e) { allQuestions = []; } }
      
      const savedWrong = localStorage.getItem('osh_wrong_ids');
      if (savedWrong) { try { wrongBook = new Set(JSON.parse(savedWrong)); } catch(e) { wrongBook = new Set(); } }

      const savedStreak = localStorage.getItem('osh_wrong_streak');
      if (savedStreak) { try { wrongStreakMap = JSON.parse(savedStreak); } catch(e) { wrongStreakMap = {}; } }

      const savedCorrect = localStorage.getItem('osh_correct_streak');
      if (savedCorrect) { try { correctStreakMap = JSON.parse(savedCorrect); } catch(e) { correctStreakMap = {}; } }

      const savedBM = localStorage.getItem('osh_bookmarks');
      if (savedBM) { try { bookmarks = new Set(JSON.parse(savedBM)); } catch(e) { bookmarks = new Set(); } }

      const savedHist = localStorage.getItem('osh_exam_history');
      if (savedHist) { try { examHistory = JSON.parse(savedHist); } catch(e) { examHistory = []; } }
    }

    function saveStorage() {
      localStorage.setItem('osh_q_db', JSON.stringify(allQuestions));
      localStorage.setItem('osh_wrong_ids', JSON.stringify(Array.from(wrongBook)));
      localStorage.setItem('osh_wrong_streak', JSON.stringify(wrongStreakMap));
      localStorage.setItem('osh_correct_streak', JSON.stringify(correctStreakMap));
      localStorage.setItem('osh_bookmarks', JSON.stringify(Array.from(bookmarks)));
      localStorage.setItem('osh_exam_history', JSON.stringify(examHistory));
    }

    function updateStats() {
      document.getElementById('stat-total-q').innerText = `${allQuestions.length} 題`;
      const badge = document.getElementById('wrong-badge');
      if (wrongBook.size > 0) {
        badge.innerText = wrongBook.size;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function renderLectures() {
      const selectVal = document.getElementById('lecture-pool-select').value;
      const container = document.getElementById('lecture-cards-container');
      
      let filtered = selectVal === "ALL" 
        ? presetLectures 
        : presetLectures.filter(l => l.pool === selectVal);

      container.innerHTML = filtered.map(lec => {
        const qCount = allQuestions.filter(q => q.cat && (getPoolName(q.cat) === lec.pool || q.cat.includes(lec.title.slice(0,4)))).length || 30;

        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border-l-4 border-amber-500 border-t border-r border-b border-slate-200 space-y-3">
            <div class="flex items-start justify-between gap-2 border-b border-slate-100 pb-2">
              <div>
                <span class="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded">${lec.pool}</span>
                <h3 class="text-sm font-black text-slate-800 mt-1">${lec.title}</h3>
              </div>
              <button onclick="startLecturePractice('${lec.pool}')" class="shrink-0 px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-lg text-[11px] font-bold transition flex items-center">
                <span>${qCount} 題可練習</span>
                <i class="fa-solid fa-arrow-right ml-1 text-[10px]"></i>
              </button>
            </div>
            <ul class="space-y-2 text-xs text-slate-600 leading-relaxed list-disc list-inside">
              ${lec.points.map(pt => `<li class="pl-1">${pt}</li>`).join('')}
            </ul>
          </div>
        `;
      }).join('');
    }

    function startLecturePractice(poolName) {
      switchTab('config');
      document.querySelectorAll('input[name="pool-cb"]').forEach(cb => cb.checked = (cb.value === poolName));
      renderSubCategories();
      toggleAllSubCategories(true);
      startExam(true);
    }

    function renderPoolSelectors() {
      const poolMap = {};
      allQuestions.forEach(q => {
        const pool = getPoolName(q.cat);
        poolMap[pool] = (poolMap[pool] || 0) + 1;
      });

      const container = document.getElementById('pool-selector');
      if (Object.keys(poolMap).length === 0) {
        container.innerHTML = '<p class="text-slate-400 py-2 text-center">題庫載入中...</p>';
        return;
      }

      container.innerHTML = Object.entries(poolMap).map(([poolName, count]) => `
        <label class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200 cursor-pointer hover:bg-indigo-50/50 transition">
          <div class="flex items-center">
            <input type="checkbox" name="pool-cb" value="${poolName}" checked onchange="renderSubCategories()" class="rounded text-indigo-600 focus:ring-0 mr-2.5">
            <span class="font-bold text-slate-700">${poolName}</span>
          </div>
          <span class="text-[11px] font-medium bg-slate-200/80 px-2 py-0.5 rounded-full text-slate-600">${count} 題</span>
        </label>
      `).join('');
    }

    function quickSelectAllPools() {
      document.querySelectorAll('input[name="pool-cb"]').forEach(cb => cb.checked = true);
      renderSubCategories();
      toggleAllSubCategories(true);
      selectCount(50);
      alert('已設定為「全真大會考／全題庫總複習」模式（全題庫隨機抽取 50 題）！');
    }

    function renderSubCategories() {
      const checkedPools = Array.from(document.querySelectorAll('input[name="pool-cb"]:checked')).map(cb => cb.value);
      const subCats = new Set();
      allQuestions.forEach(q => {
        if (checkedPools.includes(getPoolName(q.cat))) {
          subCats.add(q.cat || '綜合');
        }
      });

      const container = document.getElementById('category-selector');
      if (subCats.size === 0) {
        container.innerHTML = '<p class="col-span-2 text-slate-400 py-2 text-center">請先勾選上方題庫大類</p>';
        return;
      }

      container.innerHTML = Array.from(subCats).map(c => `
        <label class="flex items-center p-2 rounded-lg bg-slate-50 border border-slate-200 cursor-pointer hover:bg-slate-100">
          <input type="checkbox" name="subcat-cb" value="${c}" checked class="rounded text-indigo-600 focus:ring-0 mr-2">
          <span class="truncate font-medium text-slate-700">${c}</span>
        </label>
      `).join('');
    }

    function toggleAllSubCategories(check) {
      document.querySelectorAll('input[name="subcat-cb"]').forEach(el => el.checked = check);
    }

    function selectCount(num) {
      selectedCount = num;
      document.querySelectorAll('.btn-count').forEach(btn => {
        if (btn.innerText.includes(num + '')) {
          btn.className = 'btn-count py-2.5 rounded-xl border text-center font-bold text-xs bg-indigo-50 border-indigo-600 text-indigo-700 transition';
        } else {
          btn.className = 'btn-count py-2.5 rounded-xl border text-center font-bold text-xs bg-white border-slate-200 text-slate-600 transition';
        }
      });
    }

    function startExam(instantMode = false) {
      isInstantFeedback = instantMode;
      const checkedPools = Array.from(document.querySelectorAll('input[name="pool-cb"]:checked')).map(cb => cb.value);
      const checkedCats = Array.from(document.querySelectorAll('input[name="subcat-cb"]:checked')).map(el => el.value);
      
      if (checkedCats.length === 0) {
        alert('請至少勾選一個章節單元！');
        return;
      }

      currentExamPoolName = checkedPools.length === 1 ? checkedPools[0] : (checkedPools.length >= 5 ? "全真大會考(總複習)" : "自選混合題庫");

      let filtered = allQuestions.filter(q => checkedCats.includes(q.cat || '綜合'));
      if (filtered.length === 0) {
        alert('所選範圍尚無題目！');
        return;
      }

      filtered.sort(() => Math.random() - 0.5);
      currentPool = filtered.slice(0, Math.min(selectedCount, filtered.length));
      currentIndex = 0;
      userAnswers = {};

      ['lecture', 'config', 'result', 'chart', 'import', 'search'].forEach(v => {
        const el = document.getElementById(`view-${v}`);
        if (el) el.classList.add('hidden');
      });
      document.getElementById('view-exam').classList.remove('hidden');
      document.getElementById('exam-mode-badge').innerText = instantMode ? '即時回饋' : '全真模考';
      
      clearInterval(examTimer);
      if (!instantMode) {
        timeLeft = currentPool.length * 60;
        document.getElementById('timer-box').classList.remove('hidden');
        updateTimerDisplay();
        examTimer = setInterval(() => {
          timeLeft--;
          updateTimerDisplay();
          if (timeLeft <= 0) {
            clearInterval(examTimer);
            finishExam();
          }
        }, 1000);
      } else {
        document.getElementById('timer-box').classList.add('hidden');
      }

      renderPalette();
      loadQuestion(0);
    }

    function updateTimerDisplay() {
      const min = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const sec = (timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('exam-timer').innerText = `${min}:${sec}`;
    }

    function isMultiQuestion(q) {
      return Array.isArray(q.ans) && q.ans.length > 1;
    }

    function loadQuestion(index) {
      currentIndex = index;
      const q = currentPool[index];
      const isMulti = isMultiQuestion(q);
      const answered = userAnswers[index];
      const isLocked = (isInstantFeedback && answered !== undefined);

      document.getElementById('exam-progress').innerText = `${index + 1} / ${currentPool.length}`;
      document.getElementById('q-category').innerText = q.cat || '綜合';
      document.getElementById('q-type-badge').innerText = isMulti ? '複選題' : '單選題';
      document.getElementById('q-type-badge').className = isMulti 
        ? 'text-[10px] px-2 py-0.5 bg-amber-100 text-amber-800 font-bold rounded'
        : 'text-[10px] px-2 py-0.5 bg-indigo-50 text-indigo-600 font-bold rounded';
      
      document.getElementById('q-text').innerText = `${index + 1}. ${q.q}`;

      const bmBtn = document.getElementById('btn-bookmark');
      bmBtn.innerHTML = bookmarks.has(q.id) ? '<i class="fa-solid fa-bookmark text-amber-500"></i>' : '<i class="fa-regular fa-bookmark"></i>';

      const optContainer = document.getElementById('q-options');
      const multiSubmitBox = document.getElementById('multi-submit-container');

      if (isMulti) {
        multiDraft = answered ? [...answered] : [];
        if (!isLocked) {
          multiSubmitBox.classList.remove('hidden');
        } else {
          multiSubmitBox.classList.add('hidden');
        }
      } else {
        multiSubmitBox.classList.add('hidden');
      }

      optContainer.innerHTML = q.opt.map((optText, i) => {
        const optNum = i + 1;
        let optStyle = "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100";
        let disabledAttr = isLocked ? "disabled" : "";
        
        if (!isMulti) {
          if (answered !== undefined) {
            if (isInstantFeedback) {
              if (optNum === q.ans) optStyle = "bg-emerald-50 border-emerald-500 text-emerald-800 font-bold cursor-not-allowed";
              else if (optNum === answered) optStyle = "bg-rose-50 border-rose-500 text-rose-800 cursor-not-allowed";
              else optStyle = "bg-slate-50 border-slate-200 text-slate-400 opacity-60 cursor-not-allowed";
            } else {
              if (optNum === answered) optStyle = "bg-indigo-50 border-indigo-600 text-indigo-800 font-bold";
            }
          }
        } else {
          const isSelected = isLocked ? answered.includes(optNum) : multiDraft.includes(optNum);
          if (isLocked) {
            const isCorrectOpt = q.ans.includes(optNum);
            if (isCorrectOpt) optStyle = "bg-emerald-50 border-emerald-500 text-emerald-800 font-bold cursor-not-allowed";
            else if (isSelected) optStyle = "bg-rose-50 border-rose-500 text-rose-800 cursor-not-allowed";
            else optStyle = "bg-slate-50 border-slate-200 text-slate-400 opacity-60 cursor-not-allowed";
          } else {
            if (isSelected) optStyle = "bg-indigo-50 border-indigo-600 text-indigo-800 font-bold";
          }
        }

        return `
          <button onclick="handleOptionClick(${optNum})" ${disabledAttr} class="w-full p-3 rounded-xl border text-left text-xs sm:text-sm transition flex items-start space-x-2.5 ${optStyle}">
            <span class="w-5 h-5 rounded-full bg-white border border-slate-200 flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">${optNum}</span>
            <span class="leading-relaxed">${optText}</span>
          </button>
        `;
      }).join('');

      const expBox = document.getElementById('q-explanation');
      const sarcasmBox = document.getElementById('exp-sarcasm');
      const streakStatusBox = document.getElementById('exp-streak-status');
      
      if (isInstantFeedback && answered !== undefined) {
        expBox.classList.remove('hidden');
        let isCorrect = false;
        if (isMulti) {
          isCorrect = JSON.stringify([...answered].sort()) === JSON.stringify([...q.ans].sort());
        } else {
          isCorrect = answered === q.ans;
        }

        const ansLabel = isMulti ? q.ans.join('、') : q.ans;
        const correctText = isMulti ? q.ans.map(i => `${i}. ${q.opt[i-1]}`).join('；') : `${q.ans}. ${q.opt[q.ans-1]}`;
        const userText = isMulti 
          ? (answered.length > 0 ? answered.map(i => `${i}. ${q.opt[i-1]}`).join('；') : '未選')
          : (answered ? `${answered}. ${q.opt[answered-1]}` : '未選');

        document.getElementById('exp-status').innerHTML = isCorrect 
          ? `<span class="text-emerald-700 font-bold">✅ 回答正確！正解為 (${ansLabel})</span>`
          : `<span class="text-rose-700 font-bold">❌ 回答錯誤！您的選擇：【${userText}】➔ 正確解答：【${correctText}】</span>`;

        const wrongStreak = wrongStreakMap[q.id] || 0;
        if (!isCorrect && wrongStreak >= 2) {
          sarcasmBox.classList.remove('hidden');
          const randomJoke = repeatMistakeJokes[Math.floor(Math.random() * repeatMistakeJokes.length)];
          sarcasmBox.innerHTML = `${randomJoke} <span class="text-rose-600 block mt-0.5">（累計二度踩雷第 ${wrongStreak} 次）</span>`;
        } else {
          sarcasmBox.classList.add('hidden');
        }

        const curCorrectStreak = correctStreakMap[q.id] || 0;
        if (wrongBook.has(q.id)) {
          streakStatusBox.classList.remove('hidden');
          if (isCorrect) {
            streakStatusBox.innerHTML = `🎯 錯題本消除進度：連續答對 <strong>${curCorrectStreak} / 2</strong> 次！💪 再答對 1 次即可消除！`;
            streakStatusBox.className = "p-2 rounded-lg bg-emerald-50 text-emerald-800 text-[11px] font-bold";
          } else {
            streakStatusBox.innerHTML = `⚠️ 答錯重置：連續答對次數歸零（0 / 2），題目繼續留在錯題本深造！`;
            streakStatusBox.className = "p-2 rounded-lg bg-rose-50 text-rose-800 text-[11px] font-bold";
          }
        } else if (curCorrectStreak >= 2) {
          streakStatusBox.classList.remove('hidden');
          streakStatusBox.innerHTML = `🎉 太神啦！連續答對 2 次，已成功從錯題本中移除！`;
          streakStatusBox.className = "p-2 rounded-lg bg-emerald-100 text-emerald-900 text-[11px] font-bold";
        } else {
          streakStatusBox.classList.add('hidden');
        }

        let tip = q.exp || "";
        if (!tip) {
          if (q.q.includes("法") || q.q.includes("規則") || q.q.includes("標準") || (q.cat && q.cat.includes("法規"))) {
            tip = `【法規考點解析】：本題測驗法定強制標準，法規明文規定正確項目為「${correctText}」，其他選項非法定數值或權責主體。`;
          } else if (q.q.includes("不") || q.q.includes("非") || q.q.includes("錯誤")) {
            tip = `【否定題反向解析】：請注意題幹為否定句。只有「${correctText}」屬於不符合規定或錯誤的敘述，其餘選項皆為正確規範。`;
          } else {
            tip = `【核心觀念要點】：本題重點在於辨識「${q.cat || '專業科目'}」之標準作業流程，請牢記此題關鍵正解為「${correctText}」。`;
          }
        }
        document.getElementById('exp-note').innerHTML = tip;
      } else {
        expBox.classList.add('hidden');
      }

      document.getElementById('btn-prev').disabled = index === 0;
      document.getElementById('btn-next').innerText = index === currentPool.length - 1 ? '最後一題' : '下一題';
      updatePaletteStatus();
    }

    function handleOptionClick(num) {
      const q = currentPool[currentIndex];
      if (isInstantFeedback && userAnswers[currentIndex] !== undefined) {
        return;
      }

      if (isMultiQuestion(q)) {
        if (multiDraft.includes(num)) multiDraft = multiDraft.filter(x => x !== num);
        else multiDraft.push(num);
        loadQuestion(currentIndex);
      } else {
        userAnswers[currentIndex] = num;
        const isCorrect = (num === q.ans);
        handleAnswerStreakEvaluation(q.id, isCorrect);
        saveStorage();
        updateStats();
        loadQuestion(currentIndex);
      }
    }

    function submitMultiAnswer() {
      if (isInstantFeedback && userAnswers[currentIndex] !== undefined) {
        return;
      }
      if (multiDraft.length === 0) { alert('請至少選擇一個選項！'); return; }
      const q = currentPool[currentIndex];
      userAnswers[currentIndex] = [...multiDraft];
      
      const isCorrect = JSON.stringify([...multiDraft].sort()) === JSON.stringify([...q.ans].sort());
      handleAnswerStreakEvaluation(q.id, isCorrect);

      saveStorage();
      updateStats();
      loadQuestion(currentIndex);
    }

    function handleAnswerStreakEvaluation(qid, isCorrect) {
      if (isCorrect) {
        wrongStreakMap[qid] = 0;
        correctStreakMap[qid] = (correctStreakMap[qid] || 0) + 1;
        if (correctStreakMap[qid] >= 2) {
          wrongBook.delete(qid);
        }
      } else {
        wrongBook.add(qid);
        wrongStreakMap[qid] = (wrongStreakMap[qid] || 0) + 1;
        correctStreakMap[qid] = 0;
      }
    }

    function prevQuestion() { if (currentIndex > 0) loadQuestion(currentIndex - 1); }
    function nextQuestion() { if (currentIndex < currentPool.length - 1) loadQuestion(currentIndex + 1); }

    function renderPalette() {
      const palette = document.getElementById('exam-palette');
      palette.innerHTML = currentPool.map((_, i) => `
        <button onclick="loadQuestion(${i})" id="pal-btn-${i}" class="w-8 h-8 rounded-lg text-xs font-bold shrink-0 border border-slate-200 bg-white text-slate-600 flex items-center justify-center">
          ${i + 1}
        </button>
      `).join('');
    }

    function updatePaletteStatus() {
      currentPool.forEach((q, i) => {
        const btn = document.getElementById(`pal-btn-${i}`);
        if (!btn) return;
        if (i === currentIndex) {
          btn.className = "w-8 h-8 rounded-lg text-xs font-bold shrink-0 border-2 border-indigo-600 bg-indigo-50 text-indigo-700 flex items-center justify-center";
        } else if (userAnswers[i] !== undefined) {
          btn.className = "w-8 h-8 rounded-lg text-xs font-bold shrink-0 bg-slate-700 text-white flex items-center justify-center";
        } else {
          btn.className = "w-8 h-8 rounded-lg text-xs font-bold shrink-0 border border-slate-200 bg-white text-slate-500 flex items-center justify-center";
        }
      });
    }

    function toggleBookmark() {
      const q = currentPool[currentIndex];
      if (bookmarks.has(q.id)) bookmarks.delete(q.id);
      else bookmarks.add(q.id);
      saveStorage();
      loadQuestion(currentIndex);
    }

    function generateHumorComment(score, prevScore) {
      if (score === 100) return "🌟 滿分封神！勞動檢查員看到你都要起立敬禮，可以直接去考場當監考官了！";
      
      if (prevScore !== null) {
        const diff = score - prevScore;
        if (diff >= 20) return `🚀 暴風式進步 +${diff} 分！看來剛剛偷偷灌頂了職安真經，這個氣勢誰也擋不住！`;
        if (diff > 0) return `📈 小幅攀升 +${diff} 分！穩扎穩打，及格證書已經在向你招手了！`;
        if (diff <= -20) return `📉 暴跌 ${diff} 分！等等，這條曲線怎麼像高處墜落一樣刺激？安全帶扣好了沒？快去複習！`;
        if (diff < 0) return `📉 稍微倒退嚕 ${diff} 分～是不是被剛剛的題目偷襲了？別慌，喝口水再戰一回！`;
      }

      if (score >= 80) return "🔥 實力堅強！這分數穩過及格線，只要保持平常心，證照就是你的囊中物！";
      if (score >= 60) return "🎉 壓線及格！雖然驚險但及格就是王道，恭喜拿到通關入場券！";
      if (score >= 40) return "👀 距離及格還差一腳！請把錯題本當作你的早午晚餐，多啃兩次就過了！";
      return "🚑 嗶嗶嗶！現場發出職災警報，此分數需要立刻進加護病房急救，快把講義從頭看一遍！";
    }

    function finishExam() {
      clearInterval(examTimer);
      let correct = 0;
      currentPool.forEach((q, i) => {
        const ans = userAnswers[i];
        if (ans !== undefined) {
          if (isMultiQuestion(q)) {
            if (JSON.stringify([...ans].sort()) === JSON.stringify([...q.ans].sort())) correct++;
          } else {
            if (ans === q.ans) correct++;
          }
        }
      });

      const score = Math.round((correct / currentPool.length) * 100);
      const prevRecord = examHistory.length > 0 ? examHistory[examHistory.length - 1] : null;
      const prevScore = prevRecord ? prevRecord.score : null;
      const humorComment = generateHumorComment(score, prevScore);

      const record = {
        date: new Date().toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
        pool: currentExamPoolName,
        score: score,
        total: currentPool.length,
        correct: correct,
        comment: humorComment
      };
      examHistory.push(record);
      saveStorage();

      document.getElementById('view-exam').classList.add('hidden');
      document.getElementById('view-result').classList.remove('hidden');

      document.getElementById('result-score').innerText = score;
      document.getElementById('res-total').innerText = currentPool.length;
      document.getElementById('res-correct').innerText = correct;
      document.getElementById('res-wrong').innerText = currentPool.length - correct;
      document.getElementById('result-comment').innerText = humorComment;

      if (score >= 60) {
        document.getElementById('result-title').innerText = "🎉 測驗及格！保持節奏！";
        document.getElementById('result-icon').className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center text-2xl bg-emerald-100 text-emerald-600";
      } else {
        document.getElementById('result-title').innerText = "💪 仍需加強，快去刷錯題！";
        document.getElementById('result-icon').className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center text-2xl bg-rose-100 text-rose-600";
      }
    }

    function populateChartFilter() {
      const select = document.getElementById('chart-filter-pool');
      if (!select) return;
      const pools = [
        "營造業主管考題",
        "甲種業務主管 (800題庫)",
        "甲級職業安全管理 (22000)",
        "甲級職業衛生管理 (22100)",
        "職安共同科目 (90006)",
        "工作倫理與道德 (90007)"
      ];
      select.innerHTML = `<option value="ALL">🌟 全部題庫 (跨科總歷程)</option>` + 
        pools.map(p => `<option value="${p}">${p}</option>`).join('');
    }

    function renderScoreChart() {
      const selectEl = document.getElementById('chart-filter-pool');
      const filter = selectEl ? selectEl.value : "ALL";
      
      const filteredRecords = filter === "ALL" 
        ? examHistory 
        : examHistory.filter(r => r.pool === filter);

      const trendCommentEl = document.getElementById('chart-trend-comment');
      if (filteredRecords.length === 0) {
        trendCommentEl.innerText = "目前尚無資料，快去測驗幾回，考官已經準備好毒舌講評了！";
      } else if (filteredRecords.length === 1) {
        trendCommentEl.innerText = `第一戰得分 ${filteredRecords[0].score} 分！初生之犢不畏虎，多刷幾回看曲線怎麼飆！`;
      } else {
        const lastScore = filteredRecords[filteredRecords.length - 1].score;
        const firstScore = filteredRecords[0].score;
        const avgScore = Math.round(filteredRecords.reduce((a,b) => a + b.score, 0) / filteredRecords.length);
        
        if (lastScore >= 80 && avgScore >= 75) {
          trendCommentEl.innerText = `📊 平均得分 ${avgScore} 分！這曲線穩如泰山，基本上已經具備閉著眼睛答題的實力了！`;
        } else if (lastScore > firstScore) {
          trendCommentEl.innerText = `📈 從最初的 ${firstScore} 分進步到 ${lastScore} 分！進步幅度肉眼可見，請收下我的膝蓋！`;
        } else if (lastScore < firstScore) {
          trendCommentEl.innerText = `📉 曲線似乎在走下坡（${firstScore} ➔ ${lastScore} 分），是不是最近都在偷懶？快把安全帽戴好重新出發！`;
        } else {
          trendCommentEl.innerText = `⚖️ 分數呈現心電圖平穩狀態（均分 ${avgScore}），是時候突破舒適圈挑戰 90 分了！`;
        }
      }

      const labels = filteredRecords.map((r, idx) => `#${idx + 1} (${r.date.split(' ')[0]})`);
      const scores = filteredRecords.map(r => r.score);

      const canvas = document.getElementById('scoreHistoryChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      
      if (chartInstance) chartInstance.destroy();
      if (typeof Chart === 'undefined') return;

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.length > 0 ? labels : ['尚未有測驗紀錄'],
          datasets: [
            {
              label: '測驗得分 (分)',
              data: scores.length > 0 ? scores : [0],
              borderColor: '#4f46e5',
              backgroundColor: 'rgba(79, 70, 229, 0.1)',
              borderWidth: 3,
              pointBackgroundColor: scores.map(s => s >= 60 ? '#10b981' : '#f43f5e'),
              pointRadius: 5,
              fill: true,
              tension: 0.3
            },
            {
              label: '及格標準 (60分)',
              data: new Array(labels.length || 1).fill(60),
              borderColor: '#f43f5e',
              borderWidth: 1.5,
              borderDash: [5, 5],
              pointRadius: 0,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { min: 0, max: 100, ticks: { stepSize: 20 } }
          },
          plugins: {
            legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } }
          }
        }
      });

      const listContainer = document.getElementById('history-list');
      if (!listContainer) return;
      
      if (filteredRecords.length === 0) {
        listContainer.innerHTML = '<p class="text-slate-400 py-3 text-center">目前尚無此題庫測驗紀錄，快去測驗一回吧！</p>';
        return;
      }

      listContainer.innerHTML = [...filteredRecords].reverse().map(r => `
        <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl space-y-1">
          <div class="flex items-center justify-between">
            <p class="font-bold text-slate-700">${r.pool}</p>
            <span class="text-sm font-black ${r.score >= 60 ? 'text-emerald-600' : 'text-rose-600'}">${r.score} 分</span>
          </div>
          <p class="text-[10px] text-slate-400">${r.date} ｜ 抽考 ${r.total} 題 (答對 ${r.correct} 題)</p>
          <p class="text-[11px] text-amber-800 bg-amber-50/60 p-1.5 rounded-lg font-medium">${r.comment || '測驗完成！'}</p>
        </div>
      `).join('');
    }

    function clearHistoryRecords() {
      if (confirm('確定要清空所有的測驗歷史成績紀錄嗎？')) {
        examHistory = [];
        saveStorage();
        renderScoreChart();
      }
    }

    function switchTab(tab) {
      ['lecture', 'config', 'exam', 'result', 'chart', 'import', 'search'].forEach(v => {
        const el = document.getElementById(`view-${v}`);
        if (el) el.classList.add('hidden');
      });
      
      document.querySelectorAll('header .grid button').forEach(b => {
        b.className = "py-2.5 text-indigo-200 hover:text-white";
      });

      const activeBtn = document.getElementById(`tab-${tab}`);
      if (activeBtn) activeBtn.className = "py-2.5 font-bold text-white border-b-2 border-amber-400";

      if (tab === 'lecture') {
        document.getElementById('view-lecture').classList.remove('hidden');
        renderLectures();
      }
      if (tab === 'config') document.getElementById('view-config').classList.remove('hidden');
      if (tab === 'import') document.getElementById('view-import').classList.remove('hidden');
      if (tab === 'search') document.getElementById('view-search').classList.remove('hidden');
      
      if (tab === 'chart') {
        document.getElementById('view-chart').classList.remove('hidden');
        populateChartFilter();
        setTimeout(renderScoreChart, 50);
      }
      
      if (tab === 'practice') {
        if (allQuestions.length === 0) { alert('目前無題目！'); switchTab('config'); return; }
        currentPool = [...allQuestions];
        currentIndex = 0;
        userAnswers = {};
        isInstantFeedback = true;
        currentExamPoolName = "順序全題庫練習";
        document.getElementById('view-exam').classList.remove('hidden');
        document.getElementById('exam-mode-badge').innerText = '順序練習';
        document.getElementById('timer-box').classList.add('hidden');
        renderPalette();
        loadQuestion(0);
      }
      
      if (tab === 'wrong') {
        const wrongQs = allQuestions.filter(q => wrongBook.has(q.id));
        if (wrongQs.length === 0) { alert('太棒了！目前錯題本空空如也！'); switchTab('config'); return; }
        currentPool = wrongQs;
        currentIndex = 0;
        userAnswers = {};
        isInstantFeedback = true;
        currentExamPoolName = "錯題特訓複習";
        document.getElementById('view-exam').classList.remove('hidden');
        document.getElementById('exam-mode-badge').innerText = '錯題特訓';
        document.getElementById('timer-box').classList.add('hidden');
        renderPalette();
        loadQuestion(0);
      }
    }

    function handleFileImport(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (Array.isArray(parsed)) {
            allQuestions = parsed;
            saveStorage();
            renderLectures();
            renderPoolSelectors();
            renderSubCategories();
            updateStats();
            alert(`成功載入 ${parsed.length} 題題庫！`);
            switchTab('config');
          }
        } catch (err) {
          alert('JSON 解析失敗，請確認檔案格式！');
        }
      };
      reader.readAsText(file);
    }

    function handleSearch() {
      const kw = document.getElementById('search-input').value.trim().toLowerCase();
      const container = document.getElementById('search-results');
      if (!kw) { container.innerHTML = ''; return; }

      const matched = allQuestions.filter(q => q.q.toLowerCase().includes(kw));
      container.innerHTML = matched.map(q => {
        const isMulti = isMultiQuestion(q);
        const ansLabel = isMulti ? q.ans.join('、') : q.ans;
        return `
          <div class="p-3 bg-white border border-slate-200 rounded-xl text-xs space-y-1.5 shadow-sm">
            <div class="flex items-center justify-between text-slate-400 text-[10px]">
              <span class="font-medium bg-slate-100 px-1.5 py-0.5 rounded">${q.cat || '綜合'}</span>
              <span class="font-bold text-indigo-600">解答：(${ansLabel})</span>
            </div>
            <p class="font-bold text-slate-800">${q.q}</p>
            <div class="space-y-0.5 text-slate-500">
              ${q.opt.map((opt, i) => {
                const isCorrect = isMulti ? q.ans.includes(i+1) : (i+1) === q.ans;
                return `<p class="${isCorrect ? 'text-emerald-600 font-bold' : ''}">${i+1}. ${opt}</p>`;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
